name: Clone Livestreaming Repository

on:
  push:
    branches:
      - main

jobs:
  clone:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Clone Livestreaming repository and run install
      run: |
        git clone https://github.com/xterjey/Livestreaming
        cd Livestreaming
        chmod +x install.sh
        ./install.sh
